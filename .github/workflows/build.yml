name: Build Windows and Mac apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the ASIO build of PortAudio loads
        run: |
          python -c "import os; os.environ['SD_ENABLE_ASIO']='1'; import sounddevice as sd; apis=[a['name'] for a in sd.query_hostapis()]; print(sd.get_portaudio_version(), apis); assert any('ASIO' in a for a in apis), 'ASIO host API missing'"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/s3000_workbench.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build the program
        run: pyinstaller --noconfirm --clean s3000_workbench.spec

      - name: Smoke test (starts and serves the page)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\S3000 Workbench\S3000 Workbench.exe" -ArgumentList "--fake","--no-window","--stay" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep -Seconds 1; try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8741/ping; $ok = $r.Content -match 's3000-workbench' } catch {} }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Get-Content "$env:LOCALAPPDATA\S3000 Workbench\log.txt" -ErrorAction SilentlyContinue; throw "The program did not start" }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8741/
          if ($page.Content -notmatch 'S3K_APP') { Stop-Process -Id $p.Id -Force; throw "Page not served" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed"

      - name: Window test (opens the built-in window and checks the page loads in it)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\S3000 Workbench\log.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\S3000 Workbench\S3000 Workbench.exe" -ArgumentList "--fake" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep -Seconds 1; if (Test-Path $log) { $ok = (Get-Content $log -Raw) -match 'Window connected' } }
          Get-Content $log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The window did not load the Workbench" }
          if ((Get-Content $log -Raw) -match 'using a browser window|Built-in window failed') { Write-Host "::warning::The built-in window did not start on the build machine; the Edge fallback was used" }
          else { Write-Host "Built-in window loaded the Workbench" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: S3000-Workbench-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe

  mac:
    name: Mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15           # Apple Silicon (M1 and later)
            arch: apple-silicon
            optional: true
          - os: macos-15-intel     # Intel Macs
            arch: intel
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Check Core Audio and CoreMIDI load
        run: |
          python -c "import sounddevice as sd; print(sd.get_portaudio_version(), [a['name'] for a in sd.query_hostapis()])"
          python -c "import rtmidi; print('rtmidi', rtmidi.get_compiled_api())"

      - name: Read version
        id: ver
        run: echo "version=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/s3000_workbench.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: pyinstaller --noconfirm --clean s3000_workbench_mac.spec

      - name: Smoke test (starts, serves the page with Mac MIDI)
        run: |
          BIN="dist/S3000 Workbench.app/Contents/MacOS/S3000 Workbench"
          "$BIN" --fake --no-window --stay &
          PID=$!
          ok=""
          for i in $(seq 1 30); do sleep 1; if curl -s http://127.0.0.1:8741/ping | grep -q s3000-workbench; then ok=1; break; fi; done
          if [ -z "$ok" ]; then kill $PID; cat "$HOME/Library/Application Support/S3000 Workbench/log.txt" || true; exit 1; fi
          curl -s http://127.0.0.1:8741/ | grep -q '"midiBridge": true' || { kill $PID; echo "Page not served with the MIDI bridge"; exit 1; }
          kill $PID
          echo "Smoke test passed"

      - name: Window test (opens the app window and checks the page loads in it)
        run: |
          LOG="$HOME/Library/Application Support/S3000 Workbench/log.txt"
          rm -f "$LOG"
          "dist/S3000 Workbench.app/Contents/MacOS/S3000 Workbench" --fake &
          PID=$!
          ok=""
          for i in $(seq 1 60); do sleep 1; if grep -q "Window connected" "$LOG" 2>/dev/null; then ok=1; break; fi; done
          cat "$LOG" || true
          kill $PID 2>/dev/null || true
          if [ -z "$ok" ]; then echo "::warning::The window test could not confirm the page loaded on the build machine (no screen session)"; fi

      - name: Make the disk image
        run: |
          mkdir -p dmg
          cp -R "dist/S3000 Workbench.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "S3000 Workbench" -srcfolder dmg -ov -format UDZO "S3000-Workbench-${{ steps.ver.outputs.version }}-mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: S3000-Workbench-${{ steps.ver.outputs.version }}-mac-${{ matrix.arch }}
          path: "*.dmg"

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
